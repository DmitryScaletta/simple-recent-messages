name: Publish Image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

concurrency:
  group: publish

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BUILD_DIR: image
  BIN_NAME: ${{ github.event.repository.name }}
  TARGET: x86_64-unknown-linux-musl

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target "$TARGET"
      - run: |
          mkdir -p "$BUILD_DIR"
          cat << EOF > "$BUILD_DIR/Dockerfile"
          FROM scratch
          COPY ca-certificates.crt /etc/ssl/certs/ca-certificates.crt
          COPY ${BIN_NAME} /${BIN_NAME}
          ENTRYPOINT ["/${BIN_NAME}"]
          EOF
          install -Dm755 "target/$TARGET/release/$BIN_NAME" "$BUILD_DIR/$BIN_NAME"
          install -Dm644 /etc/ssl/certs/ca-certificates.crt "$BUILD_DIR/ca-certificates.crt"
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ env.BUILD_DIR }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
